      <h1>Reading</h1>
      <p>Published work behind each research interest. Every entry is peer reviewed, at a conference or in a journal. No preprints.</p>

      <h2>AI-augmented adversarial attack and defense</h2>
      <p>How automated offense changes attacker cost, and what detection has to do once reconnaissance and evasion are cheap.</p>
      <blockquote><p>Most of the attention here goes to attack demonstrations. I think the benchmarks matter more. Cybench, NYU CTF Bench, and AgentDojo turn "could an agent do this" into a number, and a number is what lets a defender argue about coverage instead of intuition. I am more optimistic than most about which side gains from this. The same automation that produces an exploit also produces the detection for it, and the defender gets to run it against their own environment first.</p></blockquote>
      <ul>
        <li><a href="https://proceedings.iclr.cc/paper_files/paper/2025/hash/3e9412a9c1d93810ef3ef7825115016b-Abstract-Conference.html">Cybench: A Framework for Evaluating Cybersecurity Capabilities and Risks of Language Models</a><br>Zhang et al. ICLR, 2025.</li>
        <li><a href="https://proceedings.neurips.cc/paper_files/paper/2024/hash/97091a5177d8dc64b1da8bf3e1f6fb54-Abstract-Datasets_and_Benchmarks_Track.html">AgentDojo: A Dynamic Environment to Evaluate Prompt Injection Attacks and Defenses for LLM Agents</a><br>Debenedetti et al. NeurIPS Datasets and Benchmarks, 2024.</li>
        <li><a href="https://proceedings.neurips.cc/paper_files/paper/2024/hash/69d97a6493fbf016fff0a751f253ad18-Abstract-Datasets_and_Benchmarks_Track.html">NYU CTF Bench: A Scalable Open-Source Benchmark Dataset for Evaluating LLMs in Offensive Security</a><br>Shao et al. NeurIPS Datasets and Benchmarks, 2024.</li>
        <li><a href="https://www.usenix.org/conference/usenixsecurity24/presentation/deng">PentestGPT: Evaluating and Harnessing Large Language Models for Automated Penetration Testing</a><br>Deng et al. USENIX Security, 2024.</li>
        <li><a href="https://proceedings.neurips.cc/paper_files/paper/2023/hash/fd6613131889a4b656206c50a8bd7790-Abstract-Conference.html">Jailbroken: How Does LLM Safety Training Fail?</a><br>Wei, Haghtalab, and Steinhardt. NeurIPS, 2023.</li>
        <li><a href="https://doi.org/10.1145/3605764.3623985">Not What You've Signed Up For: Compromising Real-World LLM-Integrated Applications with Indirect Prompt Injection</a><br>Greshake et al. AISec at ACM CCS, 2023.</li>
      </ul>

      <h2>SOC optimization</h2>
      <p>Where AI assistance lowers analyst load, and where it moves the bottleneck instead of removing it.</p>
      <blockquote><p>Both surveys reach the conclusion I reached in production: alert volume, not detection logic, is the binding constraint. That is where I think AI earns its place first, filtering noise rather than trying to replace the analyst. Rule generation is the other half of the problem. If writing a detection gets cheap, coverage expands, and the filtering has to improve at the same rate or the analyst ends up worse off than before.</p></blockquote>
      <ul>
        <li><a href="https://www.usenix.org/conference/usenixsecurity26/presentation/cai">From Texts to Rules: Generating Sigma Rules with Large Language Models from Cyber Threat Reports</a><br>Cai, Qiu, Li, Cheng, and Chen. USENIX Security, 2026.</li>
        <li><a href="https://doi.org/10.1145/3723158">Alert Fatigue in Security Operations Centres: Research Challenges and Opportunities</a><br>Tariq, Baruwal Chhetri, Nepal, and Paris. ACM Computing Surveys 57(9), 2025.</li>
        <li><a href="https://doi.org/10.1145/3695462">Alert Prioritisation in Security Operations Centres: A Systematic Survey on Criteria and Methods</a><br>Jalalvand, Baruwal Chhetri, Nepal, and Paris. ACM Computing Surveys 57(2), 2024.</li>
        <li><a href="https://www.usenix.org/conference/soups2015/proceedings/presentation/sundaramurthy">A Human Capital Model for Mitigating Security Analyst Burnout</a><br>Sundaramurthy et al. SOUPS, 2015.</li>
      </ul>

      <h2>Threat hunting and adversary intelligence</h2>
      <p>Hunting, OPSEC, and tracking adversary infrastructure over time, including what that tradecraft costs to sustain.</p>
      <blockquote><p>Provenance-based detection answers the attribution question and creates a volume question. HOLMES, UNICORN, and MAGIC each produce a graph that an analyst still has to read. The Tea Leaves result is the uncomfortable one, because threat intelligence feeds agree with each other less than most teams assume. Given the choice, I would rather expand rule coverage and filter hard than trust any single feed’s precision.</p></blockquote>
      <ul>
        <li><a href="https://www.usenix.org/conference/usenixsecurity24/presentation/jia-zian">MAGIC: Detecting Advanced Persistent Threats via Masked Graph Representation Learning</a><br>Jia et al. USENIX Security, 2024.</li>
        <li><a href="https://ieeexplore.ieee.org/document/8835390/">HOLMES: Real-Time APT Detection through Correlation of Suspicious Information Flows</a><br>Milajerdi et al. IEEE Symposium on Security and Privacy, 2019.</li>
        <li><a href="https://www.ndss-symposium.org/ndss-paper/unicorn-runtime-provenance-based-detector-for-advanced-persistent-threats/">UNICORN: Runtime Provenance-Based Detector for Advanced Persistent Threats</a><br>Han, Pasquier, Bates, Mickens, and Seltzer. NDSS, 2020.</li>
        <li><a href="https://www.usenix.org/conference/usenixsecurity21/presentation/alsaheel">ATLAS: A Sequence-based Learning Approach for Attack Investigation</a><br>Alsaheel et al. USENIX Security, 2021.</li>
        <li><a href="https://www.usenix.org/conference/usenixsecurity19/presentation/li">Reading the Tea Leaves: A Comparative Analysis of Threat Intelligence</a><br>Li et al. USENIX Security, 2019.</li>
      </ul>
