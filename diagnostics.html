<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Motion diagnostics</title>
  <meta name="description" content="Checks whether the animated meter bars on this site are running in your browser, and reports what is stopping them if they are not." />
  <!-- Link previews, so a shared link is not bare text. -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Garrett Ennis" />
  <meta property="og:title" content="Motion diagnostics" />
  <meta property="og:description" content="Checks whether the animated meter bars on this site are running in your browser, and reports what is stopping them if they are not." />
  <meta property="og:url" content="https://hi-im-pod.github.io/diagnostics.html" />
  <meta property="og:image" content="https://hi-im-pod.github.io/assets/social-card.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:image" content="https://hi-im-pod.github.io/assets/social-card.png" />
<style>
  body { margin: 0; padding: 1.25rem; background: #12131A; color: #E8E6F0;
         font: 15px/1.6 ui-sans-serif, system-ui, sans-serif; }
  h1 { font-size: 1.1rem; margin: 0 0 1rem; }
  table { border-collapse: collapse; width: 100%; max-width: 40rem; }
  td { padding: 0.5rem 0.5rem 0.5rem 0; border-bottom: 1px solid #2A2D3E; vertical-align: top; }
  td:first-child { color: #8B8CA3; width: 45%; }
  .yes { color: #2FD9C4; font-weight: 600; }
  .no { color: #FF9FD6; font-weight: 600; }
  .verdict { margin-top: 1.25rem; padding: 0.85rem; border-radius: 4px;
             border: 1px solid #FF9FD6; max-width: 40rem; }
  .verdict.ok { border-color: #2FD9C4; }
  code { font-family: ui-monospace, monospace; font-size: 0.85em; color: #B79CFF; }
  a { color: #2FD9C4; }
  .lede { color: #8B8CA3; max-width: 40rem; margin: 0 0 1.25rem; }
  .back { margin-top: 1.5rem; }
  .sample { margin-top: 1.25rem; max-width: 40rem; }
  .sample h2 { font-size: 0.85rem; color: #8B8CA3; font-weight: 500; margin: 0 0 0.4rem; }
  .sample iframe { width: 100%; height: 230px; border: 1px solid #2A2D3E; border-radius: 4px; display: block; }
</style>
</head>
<body>
<h1>Motion diagnostics</h1>
<p class="lede">If the bars on this site look frozen, this page works out why. It runs on its
own, without the site's stylesheet or scripts, so it still reports correctly when
something there is broken.</p>

<noscript>
  <div class="verdict">
    JavaScript is switched off in this browser. That alone explains a still page:
    the bars are drawn in JavaScript, so nothing will move until it is enabled.
  </div>
</noscript>

<table id="out"></table>
<div class="verdict" id="verdict">Measuring…</div>

<div class="sample">
  <h2>Live sample of the bars from the main page</h2>
  <div id="sample-slot"></div>
</div>

<p class="back"><a href="index.html">Back to the main page</a></p>

<script>
const rows = [];
const add = (k, v, cls) => rows.push(
  `<tr><td>${k}</td><td${cls ? ` class="${cls}"` : ''}>${v}</td></tr>`);

const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
add('prefers-reduced-motion', reduced ? 'reduce (motion suppressed)' : 'no-preference (motion allowed)',
    reduced ? 'no' : 'yes');
add('device pixel ratio', String(devicePixelRatio || 1));
add('viewport', `${innerWidth} x ${innerHeight}`);
add('browser', navigator.userAgent.replace(/</g, '&lt;'));

// Is requestAnimationFrame actually running at a sane rate?
let frames = 0;
const t0 = performance.now();
(function tick() { frames++; if (performance.now() - t0 < 1000) requestAnimationFrame(tick); else done(); })();

function done() {
  const fps = Math.round(frames / ((performance.now() - t0) / 1000));
  add('animation frames per second', String(fps), fps >= 30 ? 'yes' : 'no');

  // Load the real page and watch its hero bars. The frame has to be on screen
  // and scrolled to the bars: the site only redraws what is visible, so a
  // hidden frame sits frozen and this page would cry wolf.
  const f = document.createElement('iframe');
  f.src = 'index.html';
  f.title = 'Live sample of the bars from the main page';
  document.getElementById('sample-slot').appendChild(f);

  f.onload = () => setTimeout(() => {
    let verdict, ok = false;
    try {
      const c = f.contentDocument.querySelector('[data-waveform-hero] canvas');
      if (!c) throw new Error('hero canvas not found');
      // park the frame on the bars so they are both visible and redrawing
      c.scrollIntoView({ block: 'center' });
      const snap = () => c.toDataURL();
      const a = snap();
      setTimeout(() => {
        const b = snap();
        const moving = a !== b;
        add('hero bars changing', moving ? 'yes, frames differ' : 'no, frame is frozen', moving ? 'yes' : 'no');
        document.getElementById('out').innerHTML = rows.join('');

        if (reduced) {
          verdict = 'Your system asks for reduced motion, so the site is deliberately holding the bars still. ' +
            'On Windows 11: Settings &gt; Accessibility &gt; Visual effects &gt; Animation effects. Turn it on, ' +
            'then reload. On macOS: System Settings &gt; Accessibility &gt; Display &gt; Reduce motion, turn it off. ' +
            'On Android: Settings &gt; Accessibility &gt; Remove animations.';
        } else if (!moving) {
          verdict = 'Motion is allowed but the bars are not changing. That points at the page rather than your settings. ' +
            'Send me this screen.';
        } else if (fps < 30) {
          verdict = 'The bars are animating, but only at ' + fps + ' frames per second. Something is throttling the tab, ' +
            'often battery saver or a background tab. It will look like a stutter rather than a glide.';
          ok = true;
        } else {
          verdict = 'Motion is allowed, frames are healthy, and the bars are changing. The animation is running. ' +
            'The columns bounce, and a band of brightness travels across them. Each column stays inside its own ' +
            'height band as it moves, because the bands spell something.';
          ok = true;
        }
        const v = document.getElementById('verdict');
        v.innerHTML = verdict;
        if (ok) v.className = 'verdict ok';
      }, 1200);
    } catch (e) {
      add('hero bars changing', 'could not measure: ' + e.message, 'no');
      document.getElementById('out').innerHTML = rows.join('');
      document.getElementById('verdict').textContent = 'Could not read the hero canvas. Send me this screen.';
    }
  }, 1500);

  document.getElementById('out').innerHTML = rows.join('');
}
</script>
</body>
</html>
