      <h1>Garrett Ennis</h1>
      <p>AI Security Researcher / Security Engineer</p>
      <p>Optimizing AI-assisted defenders by building the attackers they have to face.</p>

      <h2>About</h2>
      <p>I am a master’s student and researcher at the SecAI Lab at Sungkyunkwan University (SKKU), and a security engineer by background. My work covers both sides of one problem: how AI assistance changes what an attacker can do at scale, and what a defender needs in order to keep pace. Before moving into research, I designed SOC architectures and SIEM ingestion pipelines for regulated environments. The limiting factor there was rarely detection logic. It was alert volume that no team could triage, which is the constraint my research starts from.</p>

      <h2>Experience</h2>
      <h3>AI Security Researcher, SecAI Lab, SKKU</h3>
      <p>2026&ndash;Present</p>
      <ul>
        <li>Study how AI assistance changes adversary capability, and what detection has to do once reconnaissance and evasion are cheap to automate.</li>
        <li>Evaluate where AI assistance lowers analyst load in a security operations center (SOC), and where it moves the bottleneck instead of removing it.</li>
        <li>Research in progress, with no published results yet.</li>
      </ul>
      <h3>Lead Security Engineer, SysArc</h3>
      <p>2022&ndash;2026</p>
      <ul>
        <li>Designed and implemented enterprise SOC architectures supporting multiple commercial and government contractor clients.</li>
        <li>Engineered SIEM ingestion pipelines processing firewall, endpoint, and cloud telemetry; improved alert fidelity and reduced noise through structured normalization validation.</li>
        <li>Directed threat hunting initiatives and cloud security operations across Azure and Microsoft 365 environments.</li>
        <li>Implemented NIST 800-171 and CMMC-aligned frameworks for regulated environments.</li>
        <li>Delivered executive-level reporting and strategic security posture assessments.</li>
      </ul>
      <h3>Cybersecurity Engineer III (Penetration Testing), Walmart Global Tech</h3>
      <p>2021&ndash;2022</p>
      <ul>

        <li>Developed structured threat models and collaborated with engineering teams to integrate secure SDLC controls.</li>
        <li>Evaluated authentication and authorization implementations in high-sensitivity environments.</li>
      </ul>

      <p>2019&ndash;2021</p>
      <ul>
        <li>Managed distributed infrastructure spanning 900+ branch locations.</li>
        <li>Engineered hybrid WAN and VPN routing architectures supporting large-scale enterprise operations.</li>
        <li>Conducted recurring security assessments and rapid incident response adjustments.</li>
      </ul>

      <p>2026–2028 (expected)</p>

      <h3>B.S. Computer Networks and Cybersecurity, University of Maryland Global Campus</h3>

      <p>GPA 3.455 of 4.0. Minor in East Asian Studies.</p>

      <h2>Research interests</h2>
      <h3>AI-augmented adversarial attack and defense</h3>
      <p>How automated offense changes attacker cost, and what detection has to do once reconnaissance and evasion are cheap.</p>
      <h3>SOC optimization</h3>
      <p>Where AI assistance lowers analyst load, and where it moves the bottleneck instead of removing it.</p>
      <h3>Threat hunting and adversary intelligence</h3>
      <p>Hunting, OPSEC, and tracking adversary infrastructure over time, including what that tradecraft costs to sustain.</p>
      <p><a href="reading.html">Reading list for these areas</a></p>

      <h2>Projects</h2>
      <h3>SIEM alert-fidelity pipeline</h3>
      <p>A generalized normalization pipeline that validates structured fields before correlation, which cuts false-positive volume in high-telemetry environments.</p>
      <p>SIEM, Detection Engineering, Python. Illustrative example, not real client work.</p>
      <h3>Cloud identity threat model</h3>
      <p>A threat-modeling walkthrough for Azure and Microsoft 365 identity flows. It maps privilege-escalation paths and ranks them by what an attacker gains.</p>
      <p>Azure, Threat Modeling, M365. Illustrative example, not real client work.</p>
      <h3>APT infrastructure tracking pattern</h3>
      <p>A method for correlating adversary infrastructure indicators over time, so hunting starts from infrastructure reuse rather than single indicators.</p>
      <p>Threat Intel, OPSEC. Illustrative example, not real client work.</p>
